# /etc/nginx/sites-available/quantsync
# QuantSync High-Performance Load Balancer & RAM-Disk Static Accelerator

upstream quantsync_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name quantsync-api.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/quantsync-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantsync-api.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 4h;

    # Gzip Compression (shrinks 1.8MB JSON down to ~120KB for fast wireless delivery)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Security & CORS Headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # ── TIER 1: ZERO-PYTHON RAM-DISK BYPASS (0.8ms response time) ─────────────
    # Reads pre-computed, minified JSON directly from Linux shared RAM (/dev/shm)
    location = /api/terminalData {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        default_type application/json;
        alias /dev/shm/quantsync/terminal_v2.json;
        error_page 404 502 = @fallback_python;
        add_header X-Served-By "QuantSync-RAM-Accelerator" always;
        add_header Cache-Control "public, max-age=1" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/terminalDataV3 {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        default_type application/json;
        alias /dev/shm/quantsync/terminal_v2.json;
        error_page 404 502 = @fallback_python;
        add_header X-Served-By "QuantSync-RAM-Accelerator" always;
        add_header Cache-Control "public, max-age=1" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/screener/breakouts {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        default_type application/json;
        alias /dev/shm/quantsync/screener_breakouts_v2.json;
        error_page 404 502 = @fallback_python;
        add_header X-Served-By "QuantSync-RAM-Accelerator" always;
        add_header Cache-Control "public, max-age=5" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── TIER 2: REAL-TIME WEBSOCKET GATEWAY ───────────────────────────────────
    location /ws/ {
        proxy_pass http://quantsync_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── TIER 3: DYNAMIC REST API PASS-THROUGH ─────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://quantsync_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @fallback_python {
        proxy_pass http://quantsync_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
