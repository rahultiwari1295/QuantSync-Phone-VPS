<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QuantSync Institutional Screener · Pattern &amp; Breakout Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #080B11;
      --bg-card: #0F141C;
      --bg-card-hover: #151C28;
      --bg-surface: #1E2638;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent: #3B82F6;
      --profit: #10B981;
      --loss: #EF4444;
      --warning: #F59E0B;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    [data-theme="light"] {
      --bg-base: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-surface: #E2E8F0;
      --border-card: #E2E8F0;
      --border-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-dim: #64748B;
      --accent: #2563EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      padding: 10px 8px 30px;
      min-height: 100vh;
    }
    .container { max-width: 100%; width: 100%; margin: 0; padding: 0 4px; }

    /* ── Header Card ── */
    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent); font-size: 10px; font-weight: 800;
      letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;
    }
    .title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--text-muted); }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .accuracy-box {
      padding: 10px 14px; border-radius: 14px;
      background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.28);
      text-align: right;
    }
    .accuracy-val { font-size: 20px; font-weight: 800; color: var(--profit); font-family: var(--font-mono); }
    .theme-toggle-btn {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--border-card); background: var(--bg-surface);
      color: var(--text-muted); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .chat-header-btn {
      height: 34px; padding: 0 12px; border-radius: 10px;
      border: 1px solid rgba(0, 168, 132, 0.4); background: rgba(0, 168, 132, 0.12);
      color: #10b981; font-size: 12px; font-weight: 700;
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: all 0.2s; white-space: nowrap;
    }
    .chat-header-btn:hover {
      background: rgba(0, 168, 132, 0.25);
      border-color: #10b981;
      transform: translateY(-1px);
    }

    /* ── KPI Row ── */
    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--border-subtle); text-align: center; width: 100%;
    }
    .kpi-lbl { font-size: 9.5px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .kpi-num { font-size: 16px; font-weight: 800; margin-top: 2px; font-family: var(--font-mono); }

    /* ── Tabs ── */
    .tabs-bar {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none;
    }
    .tab-btn {
      padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border-card);
      background: var(--bg-card); color: var(--text-muted);
      font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(59, 130, 246, 0.18); border-color: var(--accent); color: var(--text-main);
    }

    /* ── Filter Card ── */
    .filter-card {
      background: var(--bg-card); border: 1px solid var(--border-card);
      border-radius: 16px; padding: 14px; margin-bottom: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border-card); background: var(--bg-surface);
      color: var(--text-main); font-size: 13px; outline: none; font-family: inherit;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .pattern-pills-wrap {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .pattern-pills-wrap::-webkit-scrollbar { display: none; }
    .pattern-pill {
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border-card); background: var(--bg-surface);
      color: var(--text-muted); font-size: 11.5px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center;
      gap: 5px; white-space: nowrap; transition: all 0.15s ease;
    }
    .pattern-pill.active {
      border-color: var(--accent); background: rgba(59, 130, 246, 0.18);
      color: var(--text-main); font-weight: 800;
    }

    /* ── Advanced Filters ── */
    .adv-filters-toggle {
      font-size: 11px; font-weight: 700; color: var(--accent); cursor: pointer;
      display: flex; align-items: center; gap: 4px; user-select: none;
    }
    .adv-filters-panel {
      display: none; flex-direction: column; gap: 8px;
      padding-top: 10px; border-top: 1px solid var(--border-subtle);
    }
    .adv-filters-panel.open { display: flex; }
    .filters-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .select-ctl {
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--border-card); background: var(--bg-surface);
      color: var(--text-main); font-size: 11.5px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .select-ctl option { background: #1E2638; }
    .chip-ctl {
      padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border-card);
      background: var(--bg-surface); color: var(--text-muted);
      font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .chip-ctl.on { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.15); }
    .score-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .score-slider {
      -webkit-appearance: none; height: 4px; border-radius: 3px;
      background: var(--bg-surface); outline: none; width: 100px;
    }
    .score-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
    }
    .btn-clear-adv {
      font-size: 11px; font-weight: 700; color: var(--loss); cursor: pointer;
      background: none; border: none; padding: 0; font-family: inherit;
    }

    /* ── Results Count ── */
    .results-meta {
      font-size: 11px; color: var(--text-dim); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sort-select {
      padding: 4px 8px; border-radius: 6px; font-size: 11px;
      border: 1px solid var(--border-card); background: var(--bg-surface);
      color: var(--text-muted); font-family: inherit; cursor: pointer;
    }

    /* ── Stock Cards ── */
    .stocks-list { display: flex; flex-direction: column; gap: 10px; }
    .stock-card {
      background: var(--bg-card); border: 1px solid var(--border-card);
      border-radius: 16px; padding: 14px 16px; cursor: pointer;
      transition: all 0.2s;
    }
    .stock-card:hover {
      transform: translateX(2px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.1);
    }
    .stock-card.near { border-left: 3px solid var(--warning); }
    .stock-card.success { border-left: 3px solid var(--profit); }
    .stock-card.failed { border-left: 3px solid var(--loss); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .sym { font-size: 15px; font-weight: 800; font-family: var(--font-mono); }
    .badge-pill {
      font-size: 10px; padding: 2px 7px; border-radius: 4px;
      background: var(--bg-surface); color: var(--text-muted);
      font-weight: 700; margin-left: 6px;
    }
    .pattern-strip {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding: 8px 12px; border-radius: 8px;
      background: var(--bg-surface); font-size: 11.5px;
    }
    .metrics-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-top: 10px; font-size: 10.5px;
    }
    .metric-label { color: var(--text-dim); }
    .metric-val { font-family: var(--font-mono); font-weight: 700; color: var(--text-main); }

    /* ── R/R Bar ── */
    .rr-bar-wrap { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .rr-track { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-surface); display: flex; overflow: hidden; }
    .rr-stop { background: rgba(239,68,68,0.55); height: 100%; border-radius: 3px 0 0 3px; }
    .rr-target { background: rgba(16,185,129,0.55); height: 100%; border-radius: 0 3px 3px 0; }
    .rr-badge {
      font-size: 10.5px; font-weight: 800; font-family: var(--font-mono);
      padding: 1px 7px; border-radius: 5px; border: 1px solid; white-space: nowrap;
    }
    .rr-good { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.25); color: var(--profit); }
    .rr-ok   { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.25); color: var(--warning); }
    .rr-poor { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.25); color: var(--loss); }

    /* ── Entry Badge ── */
    .radar-entry-badge {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 6px; padding: 6px 10px; border-radius: 8px;
      margin-top: 8px; font-size: 11px; font-weight: 800;
    }
    .radar-entry-badge.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: var(--profit); }
    .radar-entry-badge.near { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: var(--warning); }

    /* ── Skeleton loader ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-card-hover) 50%, var(--bg-surface) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }
    .skeleton-card {
      background: var(--bg-card); border: 1px solid var(--border-card);
      border-radius: 16px; padding: 14px 16px;
    }
    .sk-line { height: 12px; margin-bottom: 8px; }
    .sk-line.wide { width: 60%; }
    .sk-line.mid  { width: 40%; }
    .sk-line.slim { width: 25%; }
    .sk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .sk-box { height: 32px; border-radius: 6px; }

    /* ── Sector Heatmap ── */
    .sector-strip {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 12px; scrollbar-width: none;
    }
    .sector-strip::-webkit-scrollbar { display: none; }
    .sector-chip {
      padding: 5px 10px; border-radius: 8px; font-size: 10.5px; font-weight: 700;
      white-space: nowrap; border: 1px solid var(--border-subtle);
      background: var(--bg-card); color: var(--text-muted); cursor: pointer;
      transition: all 0.15s;
    }
    .sector-chip:hover, .sector-chip.active {
      border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1);
    }
    .sector-count { font-size: 9px; opacity: 0.7; }

    /* ── Breakout Retest Tab specific ── */
    .bk-lvls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
    .bk-lbox { background: var(--bg-surface); border-radius: 8px; padding: 6px 8px; text-align: center; }
    .bk-llbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 2px; }
    .bk-lval { font-size: 13px; font-weight: 800; font-family: var(--font-mono); }
    .bk-lval.entry { color: #06B6D4; }
    .bk-lval.stop  { color: var(--loss); }
    .bk-lval.tgt   { color: var(--profit); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <div style="flex:1;min-width:0;">
        <div class="badge-chip">⚡ QuantSync Institutional Screener</div>
        <div class="title">Pattern &amp; Breakout Radar</div>
        <div class="subtitle" id="scanMeta">Scanned across 1,318 NSE universe equities</div>
        <div id="scanDateBadge" style="display:none;margin-top:4px;"></div>
        <div class="kpi-row">
          <div>
            <div class="kpi-lbl">Universe</div>
            <div class="kpi-num" id="kpiUniverse">—</div>
          </div>
          <div>
            <div class="kpi-lbl">Bullish</div>
            <div class="kpi-num" id="kpiBullish">—</div>
          </div>
          <div>
            <div class="kpi-lbl">Near BK</div>
            <div class="kpi-num" id="kpiNear">—</div>
          </div>
          <div>
            <div class="kpi-lbl">Confirmed</div>
            <div class="kpi-num" id="kpiSuccess">—</div>
          </div>
        </div>
      </div>
      <div class="header-right">
        <a href="/chat.html" class="chat-header-btn" title="Open Live Traders Community Lounge">
          💬 <span>Traders Chat</span>
        </a>
        <div class="accuracy-box" id="accuracyBox" style="display:none;">
          <div style="font-size: 9.5px; font-weight: 700; color: var(--profit); text-transform: uppercase;">90D Win Rate</div>
          <div class="accuracy-val" id="accuracyVal">0%</div>
          <div style="font-size: 9.5px; color: var(--text-dim);" id="accuracyMeta">Verified signals</div>
        </div>
        <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme" onclick="toggleTheme()">🌙</button>
      </div>
    </div>

    <!-- Sector Heatmap Strip -->
    <div class="sector-strip" id="sectorStrip"></div>

    <!-- Primary Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-near_breakout" onclick="setTab('near_breakout', this)">🎯 Near Breakout <span id="countNear"></span></button>
      <button class="tab-btn" id="tab-success" onclick="setTab('success', this)">🚀 Confirmed <span id="countSuccess"></span></button>
      <button class="tab-btn" id="tab-retest" onclick="setTab('retest', this)">🔄 Pivot Retest <span id="countRetest"></span></button>
      <button class="tab-btn" id="tab-failed" onclick="setTab('failed', this)">⚠️ At Risk <span id="countFailed"></span></button>
    </div>

    <!-- Pattern Explorer & Search -->
    <div class="filter-card">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Search stock ticker or company name..." oninput="debounceSearch(this.value)">
        <button class="theme-toggle-btn" onclick="clearSearch()" title="Clear search" style="flex-shrink:0;">✕</button>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;">Chart Patterns &amp; Bases</span>
          <span id="clearPatternBtn" style="font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;display:none;" onclick="selectPattern('ALL')">Clear</span>
        </div>
        <div class="pattern-pills-wrap">
          <button class="pattern-pill active" onclick="selectPattern('ALL', this)"><span>✨</span> All Setups</button>
          <button class="pattern-pill" onclick="selectPattern('Breakout Rally', this)"><span>🚀</span> Breakout Rally</button>
          <button class="pattern-pill" onclick="selectPattern('Double Bottom', this)"><span>🇼</span> Double Bottom</button>
          <button class="pattern-pill" onclick="selectPattern('Horizontal Range', this)"><span>📏</span> Horizontal Base</button>
          <button class="pattern-pill" onclick="selectPattern('Orderly Pullback', this)"><span>📉</span> 50-EMA Dip</button>
          <button class="pattern-pill" onclick="selectPattern('Volatility Contraction', this)"><span>🌪️</span> VCP Squeeze</button>
          <button class="pattern-pill" onclick="selectPattern('Triangle', this)"><span>📐</span> Triangle / Wedge</button>
        </div>
      </div>
      <!-- Advanced Filters -->
      <div>
        <div class="adv-filters-toggle" id="advToggle" onclick="toggleAdvFilters()">
          <span id="advArrow">▸</span> Advanced Filters
        </div>
        <div class="adv-filters-panel" id="advPanel">
          <div class="filters-row">
            <select class="select-ctl" id="filterSector" onchange="applyFilters()">
              <option value="">All Sectors</option>
            </select>
            <select class="select-ctl" id="filterMcap" onchange="applyFilters()">
              <option value="">All Market Caps</option>
              <option value="Large Cap">Large Cap</option>
              <option value="Mid Cap">Mid Cap</option>
              <option value="Small Cap">Small Cap</option>
              <option value="Micro Cap">Micro Cap</option>
            </select>
            <button class="chip-ctl" id="filterFno" onclick="toggleFno()">F&amp;O Only</button>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="score-label">Min DNA: <span id="scoreVal">50</span></span>
              <input type="range" class="score-slider" id="filterScore" min="0" max="100" value="50" oninput="document.getElementById('scoreVal').textContent=this.value" onchange="applyFilters()">
            </div>
            <button class="btn-clear-adv" onclick="clearAdvFilters()">✕ Reset</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Results Meta -->
    <div class="results-meta">
      <span id="resultsMeta">Loading…</span>
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="default">Sort: Default</option>
        <option value="dna_score">Sort: DNA Score ↓</option>
        <option value="rsi">Sort: RSI ↓</option>
        <option value="volume_ratio">Sort: Volume Ratio ↓</option>
      </select>
    </div>

    <!-- Stock Cards -->
    <div class="stocks-list" id="stocksList">
      <!-- Skeleton preload -->
      <div class="skeleton-card"><div class="skeleton sk-line wide"></div><div class="skeleton sk-line mid"></div><div class="sk-row"><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div></div></div>
      <div class="skeleton-card"><div class="skeleton sk-line wide"></div><div class="skeleton sk-line mid"></div><div class="sk-row"><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div></div></div>
      <div class="skeleton-card"><div class="skeleton sk-line wide"></div><div class="skeleton sk-line mid"></div><div class="sk-row"><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div><div class="skeleton sk-box"></div></div></div>
    </div>
  </div>

  <script>
    let currentTab = 'near_breakout';
    let selectedPattern = 'ALL';
    let searchVal = '';
    let fnoOnly = false;
    let _searchTimer = null;
    let _currentTheme = 'dark';

    // ── Debounce search ──────────────────────────────────────────────────────
    function debounceSearch(v) {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(() => { searchVal = v.trim(); applyFilters(); }, 300);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchVal = '';
      applyFilters();
    }

    // ── Theme toggle ─────────────────────────────────────────────────────────
    function toggleTheme() {
      _currentTheme = _currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', _currentTheme);
      document.getElementById('themeToggle').textContent = _currentTheme === 'dark' ? '🌙' : '☀️';
      try { localStorage.setItem('qs_theme', _currentTheme); } catch(e){}
    }

    // ── Advanced filters ─────────────────────────────────────────────────────
    function toggleAdvFilters() {
      const panel = document.getElementById('advPanel');
      const arrow = document.getElementById('advArrow');
      const isOpen = panel.classList.toggle('open');
      arrow.textContent = isOpen ? '▾' : '▸';
    }

    function toggleFno() {
      fnoOnly = !fnoOnly;
      document.getElementById('filterFno').classList.toggle('on', fnoOnly);
      applyFilters();
    }

    function clearAdvFilters() {
      document.getElementById('filterSector').value = '';
      document.getElementById('filterMcap').value = '';
      document.getElementById('filterScore').value = 50;
      document.getElementById('scoreVal').textContent = '50';
      fnoOnly = false;
      document.getElementById('filterFno').classList.remove('on');
      applyFilters();
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function init() {
      const urlParams = new URLSearchParams(window.location.search);

      // Theme
      let th = urlParams.get('theme');
      if (!th) { try { th = localStorage.getItem('qs_theme') || 'dark'; } catch(e) { th = 'dark'; } }
      _currentTheme = th;
      document.documentElement.setAttribute('data-theme', th);
      document.getElementById('themeToggle').textContent = th === 'dark' ? '🌙' : '☀️';

      // Tab from URL
      const tabParam = urlParams.get('tab');
      if (tabParam && document.getElementById('tab-' + tabParam)) {
        currentTab = tabParam;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tabParam).classList.add('active');
      }

      // Search from URL
      const searchParam = urlParams.get('search') || urlParams.get('symbol');
      if (searchParam) {
        searchVal = searchParam.trim();
        document.getElementById('searchInput').value = searchVal;
      }

      loadSummary();
      loadAccuracy();
      loadBreakoutCounts();
      applyFilters();
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/screener/summary');
        const d = await res.json();
        if (d && d.scan_date) {
          const n = (d.total_stocks || 0).toLocaleString();
          document.getElementById('scanMeta').textContent =
            'Scanned across ' + n + ' NSE equities · ' + d.scan_date;
          document.getElementById('kpiUniverse').textContent = n;
          const bullish = (d.stances || {}).BULLISH || 0;
          document.getElementById('kpiBullish').textContent = bullish.toLocaleString();

          // Weekend-aware freshness indicator
          const badge = document.getElementById('scanDateBadge');
          if (badge && d.scan_date) {
            const nowIST = new Date(new Date().getTime() + (5.5 * 60 * 60 * 1000));
            const todayIST = nowIST.toISOString().slice(0, 10);
            const scanDate = d.scan_date;
            const dayOfWeek = nowIST.getUTCDay(); // 0 = Sun, 6 = Sat
            const daysDiff = Math.floor((new Date(todayIST) - new Date(scanDate)) / (1000 * 60 * 60 * 24));

            if (daysDiff === 0) {
              badge.innerHTML = '<span style="color:#10b981;font-size:11px;font-weight:700;">✅ Today\'s EOD data</span>';
            } else if (daysDiff === 1 && (dayOfWeek === 6 || dayOfWeek === 1)) {
              badge.innerHTML = '<span style="color:#10b981;font-size:11px;font-weight:700;">✅ Friday\'s EOD close (Active)</span>';
            } else if (daysDiff === 2 && dayOfWeek === 0) {
              badge.innerHTML = '<span style="color:#10b981;font-size:11px;font-weight:700;">✅ Weekend · Friday\'s EOD close</span>';
            } else if (daysDiff === 1) {
              badge.innerHTML = '<span style="color:#f59e0b;font-size:11px;font-weight:700;">⚠️ Previous close (Overnight batch running)</span>';
            } else {
              badge.innerHTML = `<span style="color:#ef4444;font-size:11px;font-weight:700;">🚨 Data is ${daysDiff} days old — batch may have failed!</span>`;
            }
            badge.style.display = 'block';
          }

          // Sector heatmap
          const sectors = d.top_sectors || {};
          buildSectorStrip(sectors);

          // Populate sector dropdown
          const sel = document.getElementById('filterSector');
          Object.keys(sectors).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s + ' (' + sectors[s] + ')';
            sel.appendChild(opt);
          });
        }
      } catch (e) {}
    }

    function buildSectorStrip(sectors) {
      const strip = document.getElementById('sectorStrip');
      if (!strip || !Object.keys(sectors).length) return;
      // Find max for heat coloring
      const max = Math.max(...Object.values(sectors));
      strip.innerHTML = Object.entries(sectors).map(([sec, cnt]) => {
        const intensity = Math.round((cnt / max) * 100);
        const isHot = intensity > 60;
        return `<div class="sector-chip ${isHot ? '' : ''}" onclick="setSector('${sec}', this)" title="${cnt} setups">
          ${isHot ? '🔥 ' : ''}${sec} <span class="sector-count">${cnt}</span>
        </div>`;
      }).join('');
    }

    function setSector(sec, el) {
      const sel = document.getElementById('filterSector');
      if (sel.value === sec) {
        sel.value = '';
        document.querySelectorAll('.sector-chip').forEach(c => c.classList.remove('active'));
      } else {
        sel.value = sec;
        document.querySelectorAll('.sector-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        // Open advanced panel to show the active filter
        const panel = document.getElementById('advPanel');
        if (!panel.classList.contains('open')) toggleAdvFilters();
      }
      applyFilters();
    }

    async function loadAccuracy() {
      try {
        const res = await fetch('/api/screener/accuracy?days=90');
        const d = await res.json();
        if (d && d.win_rate_pct > 0) {
          document.getElementById('accuracyBox').style.display = 'block';
          document.getElementById('accuracyVal').textContent = d.win_rate_pct + '%';
          document.getElementById('accuracyMeta').textContent =
            d.winners + ' of ' + d.total_resolved_signals + ' signals verified';
        }
      } catch (e) {}
    }

    async function loadBreakoutCounts() {
      try {
        const res = await fetch('/api/screener/breakouts');
        const d = await res.json();
        if (d) {
          const nearLen    = (d.near_breakout || []).length;
          const successLen = (d.success || []).length;
          const retestLen  = (d.retest || []).length;
          document.getElementById('countNear').textContent    = nearLen;
          document.getElementById('countSuccess').textContent = successLen;
          document.getElementById('countRetest').textContent  = retestLen;
          document.getElementById('kpiNear').textContent      = nearLen;
          document.getElementById('kpiSuccess').textContent   = successLen;
        }
      } catch (e) {}
    }

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function selectPattern(pat, btn) {
      selectedPattern = pat;
      document.querySelectorAll('.pattern-pill').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        document.querySelectorAll('.pattern-pill').forEach(p => {
          if (p.textContent.includes('All Setups') && pat === 'ALL') p.classList.add('active');
        });
      }
      const clearBtn = document.getElementById('clearPatternBtn');
      if (clearBtn) clearBtn.style.display = (pat === 'ALL') ? 'none' : 'inline';
      applyFilters();
    }

    function showSkeletons() {
      document.getElementById('stocksList').innerHTML = [1,2,3,4,5].map(() => `
        <div class="skeleton-card">
          <div class="skeleton sk-line wide"></div>
          <div class="skeleton sk-line mid"></div>
          <div class="sk-row">
            <div class="skeleton sk-box"></div>
            <div class="skeleton sk-box"></div>
            <div class="skeleton sk-box"></div>
            <div class="skeleton sk-box"></div>
          </div>
        </div>`).join('');
    }

    async function applyFilters() {
      showSkeletons();
      document.getElementById('resultsMeta').textContent = 'Loading…';

      const params = new URLSearchParams();
      params.set('limit', '150');

      if (currentTab === 'near_breakout')  { params.set('pattern_stage', 'NEAR_BREAKOUT'); }
      else if (currentTab === 'success')   { params.set('breakout_status', 'SUCCESS'); }
      else if (currentTab === 'retest')    { params.set('setup', 'breakout_retest'); }
      else if (currentTab === 'failed')    { params.set('breakout_status', 'FAILED'); }

      if (selectedPattern !== 'ALL') params.set('pattern_type', selectedPattern);
      if (searchVal) params.set('search', searchVal);

      // Advanced filters
      const sector = document.getElementById('filterSector').value;
      const mcap   = document.getElementById('filterMcap').value;
      const score  = parseInt(document.getElementById('filterScore').value) || 50;
      if (sector) params.set('sector', sector);
      if (mcap)   params.set('mcap_tier', mcap);
      if (score > 0) params.set('min_score', score);
      if (fnoOnly)  params.set('is_fno', '1');

      try {
        const res = await fetch('/api/screener?' + params.toString());
        const d = await res.json();
        let rows = d.rows || [];

        // Client-side sort override
        const sortBy = document.getElementById('sortSelect').value;

        // Tab-specific client guard + sort
        if (currentTab === 'success') {
          rows = rows.filter(s => s.breakout_level && Number(s.breakout_level) > 0);
          if (sortBy === 'default') {
            rows.sort((a, b) => {
              const diffA = Math.abs((Number(a.curr_price) - Number(a.breakout_level)) / Number(a.breakout_level) * 100);
              const diffB = Math.abs((Number(b.curr_price) - Number(b.breakout_level)) / Number(b.breakout_level) * 100);
              if ((diffA > 5) !== (diffB > 5)) return diffA > 5 ? 1 : -1;
              return diffA - diffB;
            });
          }
        } else if (currentTab === 'near_breakout') {
          rows = rows.filter(s => {
            const hasPivot = s.breakout_level && Number(s.breakout_level) > 0;
            if (!hasPivot) return false;
            const dist = (Number(s.breakout_level) - Number(s.curr_price)) / Number(s.breakout_level) * 100;
            return Number(s.curr_price) < Number(s.breakout_level) && dist <= 5.0 && dist >= 0;
          });
          if (sortBy === 'default') {
            rows.sort((a, b) => {
              const dA = (Number(a.breakout_level) - Number(a.curr_price)) / Number(a.breakout_level);
              const dB = (Number(b.breakout_level) - Number(b.curr_price)) / Number(b.breakout_level);
              return dA - dB;
            });
          }
        }

        // Override sort if user chose custom
        if (sortBy === 'dna_score') {
          rows.sort((a, b) => (Number(b.dna_score) || 0) - (Number(a.dna_score) || 0));
        } else if (sortBy === 'rsi') {
          rows.sort((a, b) => (Number(b.rsi) || 0) - (Number(a.rsi) || 0));
        } else if (sortBy === 'volume_ratio') {
          rows.sort((a, b) => (Number(b.volume_ratio_20d) || 0) - (Number(a.volume_ratio_20d) || 0));
        }

        renderStocks(rows, d.total || rows.length);

        // Update failed tab count
        if (currentTab === 'failed') {
          document.getElementById('countFailed').textContent = rows.length;
        }
      } catch (e) {
        document.getElementById('stocksList').innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--loss)">Failed to load. Please refresh.</div>';
        document.getElementById('resultsMeta').textContent = '';
      }
    }

    function fp(n) {
      if (n == null || n === '') return '—';
      return Number(n).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function renderStocks(rows, total) {
      const listEl = document.getElementById('stocksList');
      document.getElementById('resultsMeta').textContent = `Showing ${rows.length} of ${total || rows.length} setups`;

      if (!rows.length) {
        listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)"><div style="font-size:28px;margin-bottom:8px;">🔍</div><b>No Actionable Setups Found</b><div style="font-size:12px;margin-top:4px;">Try clearing filters or selecting "All Setups."</div></div>';
        return;
      }

      listEl.innerHTML = rows.map(function(s) {
        const hasPivot    = s.breakout_level && Number(s.breakout_level) > 0;
        const cmp         = Number(s.curr_price || 0);
        const brk         = Number(s.breakout_level || 0);
        const tgt         = Number(s.target_1 || 0);
        const sl          = Number(s.stop_loss || 0);
        const diffPct     = hasPivot ? ((cmp - brk) / brk * 100) : 0;
        const diffAbs     = Math.abs(diffPct);
        const targetGain  = (tgt > 0 && cmp > 0) ? ((tgt - cmp) / cmp * 100) : null;
        const rr          = Number(s.risk_reward_ratio || 0);
        const volRatio    = Number(s.volume_ratio_20d || 0);
        const vcpScore    = Number(s.vcp_score || 0);
        const minStage    = s.minervini_stage || '';

        const isNear    = s.pattern_stage === 'NEAR_BREAKOUT' || (hasPivot && cmp < brk && diffAbs <= 5.0);
        const isSuccess = s.breakout_status === 'SUCCESS';
        const isFailed  = s.breakout_status === 'FAILED';
        const isMissed  = diffAbs > 5.0;
        const isSkip    = !isMissed && targetGain !== null && targetGain < 5.0;
        const isGoodBuy = !isMissed && !isSkip;

        const cardClass = isSuccess
          ? (isMissed ? 'failed' : isSkip ? 'near' : 'success')
          : (isNear ? 'near' : (isFailed ? 'failed' : ''));

        const score = s.dna_score || 50;
        const sc    = score >= 75 ? 'var(--profit)' : score >= 50 ? 'var(--warning)' : 'var(--loss)';
        const sym   = s.symbol || '';
        const esc   = sym.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        const cmpFmt = Number(s.curr_price || 0).toLocaleString('en-IN', {minimumFractionDigits: 2});
        const daysSince = s.days_since_breakout != null ? Number(s.days_since_breakout) : null;
        const daysLabel = daysSince === 0 ? '🔥 Today' : daysSince === 1 ? '⚡ 1d ago' : daysSince != null ? '⚡ ' + daysSince + 'd ago' : '';

        // Entry Banner
        let entryBanner = '';
        if (isSuccess && hasPivot && isGoodBuy) {
          entryBanner = `<div class="radar-entry-badge success"><span>🟢 Good to Buy: ${diffPct >= 0 ? '+' : ''}${diffPct.toFixed(1)}% from BK (₹${brk.toFixed(1)})</span>${daysLabel ? `<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">${daysLabel}</span>` : ''}</div>`;
        } else if (isSuccess && hasPivot && isSkip) {
          entryBanner = `<div class="radar-entry-badge near"><span>⏭️ SKIP: ${targetGain !== null ? targetGain.toFixed(1) : '0'}% left to target</span>${daysLabel ? `<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">${daysLabel}</span>` : ''}</div>`;
        } else if (isSuccess && hasPivot && isMissed) {
          entryBanner = `<div class="radar-entry-badge" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:var(--loss);"><span>🛑 MISSED: ${diffPct >= 0 ? '+' : ''}${diffPct.toFixed(1)}% from BK (₹${brk.toFixed(1)})</span>${daysLabel ? `<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">${daysLabel}</span>` : ''}</div>`;
        } else if (isNear && hasPivot && !isSuccess) {
          entryBanner = `<div class="radar-entry-badge" style="background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.25);color:var(--accent);"><span>🎯 Ready to Buy at ₹${brk.toFixed(1)}</span><span style="background:rgba(255,255,255,0.06);color:var(--text-dim);padding:1px 6px;border-radius:4px;">(${diffAbs.toFixed(2)}% left)</span></div>`;
        }

        // R/R visual bar
        let rrBar = '';
        if (sl > 0 && tgt > 0 && brk > 0) {
          const stopDist = Math.abs(brk - sl);
          const tgtDist  = Math.abs(tgt - brk);
          const total    = stopDist + tgtDist;
          const stopPct  = total > 0 ? (stopDist / total * 100).toFixed(0) : 50;
          const tgtPct   = total > 0 ? (tgtDist / total * 100).toFixed(0) : 50;
          const rrClass  = rr >= 2 ? 'rr-good' : rr >= 1.5 ? 'rr-ok' : 'rr-poor';
          rrBar = `<div class="rr-bar-wrap">
            <div class="rr-track"><div class="rr-stop" style="width:${stopPct}%"></div><div class="rr-target" style="width:${tgtPct}%"></div></div>
            <span class="rr-badge ${rrClass}">R/R ${rr > 0 ? rr.toFixed(1) + 'x' : '—'}</span>
          </div>`;
        }

        // Stage badge
        const stageBadge = minStage ? `<span class="badge-pill" style="color:#8B5CF6;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.25);">📊 ${minStage}</span>` : '';

        // VCP badge
        const vcpBadge = vcpScore >= 1.2 ? `<span class="badge-pill" style="color:#06B6D4;background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.25);">🌪️ VCP ${vcpScore.toFixed(2)}</span>` : '';

        // Volume ratio display
        const volDisplay = volRatio > 0
          ? `<span style="color:${volRatio >= 1.5 ? 'var(--profit)' : volRatio >= 1 ? 'var(--text-muted)' : 'var(--loss)'};">${volRatio.toFixed(2)}x</span>`
          : '—';

        return `<div class="stock-card ${cardClass}" onclick="openDna('${esc}')">
          <div class="card-top">
            <div>
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
                <span class="sym">${sym}</span>
                ${s.pattern_type ? `<span class="badge-pill" style="color:var(--accent);background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);">📐 ${s.pattern_type}</span>` : ''}
                ${s.mcap_tier ? `<span class="badge-pill">${s.mcap_tier}</span>` : ''}
                ${stageBadge}
                ${vcpBadge}
              </div>
              <div style="font-size:11px;color:var(--text-dim);margin-top:3px">${s.company_name || s.sector || '—'}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:15px;font-weight:800;font-family:var(--font-mono);">₹${cmpFmt}</div>
              <div style="font-size:10px;font-weight:700;color:${sc};margin-top:2px;">DNA: ${score}/100</div>
            </div>
          </div>
          ${entryBanner}
          ${rrBar}
          <div class="metrics-row">
            <div><span class="metric-label">BK Level: </span><span class="metric-val">${s.breakout_level ? '₹' + Number(s.breakout_level).toFixed(1) : '—'}</span></div>
            <div><span class="metric-label">RSI (14): </span><span class="metric-val">${s.rsi != null ? Number(s.rsi).toFixed(1) : '—'}</span></div>
            <div><span class="metric-label">Vol Ratio: </span><span class="metric-val">${volDisplay}</span></div>
            <div><span class="metric-label">ADX: </span><span class="metric-val">${s.adx14 != null ? Number(s.adx14).toFixed(0) : '—'}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    function openDna(sym) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'SELECT_STOCK', symbol: sym }, '*');
        return;
      }
      window.location.href = '/stock-detail.html?symbol=' + encodeURIComponent(sym);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
